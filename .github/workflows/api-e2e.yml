name: API E2E

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sreda_test?schema=public
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run E2E with coverage
        run: npm run test:e2e -- --coverage

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage-html
          path: apps/api/coverage/e2e/lcov-report
          if-no-files-found: warn

      - name: Upload coverage lcov
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage-lcov
          path: apps/api/coverage/e2e/lcov.info
          if-no-files-found: warn

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage-summary
          path: apps/api/coverage/e2e/coverage-summary.json
          if-no-files-found: warn
