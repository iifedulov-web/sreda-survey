name: API E2E

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sreda_test?schema=public

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sreda_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d sreda_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Seed DB
        run: npm run db:seed --if-present

      - name: Run E2E with coverage
        run: npm run test:e2e -- --coverage

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage-html
          path: coverage/e2e/lcov-report
          if-no-files-found: warn

      - name: Upload coverage lcov
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage-lcov
          path: coverage/e2e/lcov.info
          if-no-files-found: warn

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage-summary
          path: coverage/e2e/coverage-summary.json
          if-no-files-found: warn
