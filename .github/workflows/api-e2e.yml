name: API E2E

on:
  push:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'prisma/**'
      - '.github/workflows/api-e2e.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'jest*.json'
      - 'jest*.js'
      - 'jest*.ts'
      - 'nest-cli.json'
  pull_request:
    branches: [master, main]
    paths:
      - 'src/**'
      - 'test/**'
      - 'prisma/**'
      - '.github/workflows/api-e2e.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'jest*.json'
      - 'jest*.js'
      - 'jest*.ts'
      - 'nest-cli.json'

concurrency:
  group: api-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci
      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: Run E2E with coverage
        run: npm run test:e2e -- --coverage

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage-html
          path: coverage/e2e/lcov-report
          if-no-files-found: warn

      - name: Upload coverage lcov
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage-lcov
          path: coverage/e2e/lcov.info
          if-no-files-found: warn

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage-summary
          path: coverage/e2e/coverage-summary.json
          if-no-files-found: warn

  coverage-comment:
    if: github.event_name == 'pull_request'
    needs: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Download coverage summary artifact
        uses: actions/download-artifact@v4
        with:
          name: e2e-coverage-summary
          path: coverage/e2e

      - name: Build coverage body
        id: cov
        shell: bash
        run: |
          FILE="coverage/e2e/coverage-summary.json"
          if [ ! -f "$FILE" ]; then
            echo "body=вљ пёЏ coverage-summary.json not found" >> $GITHUB_OUTPUT
            exit 0
          fi

          LINES=$(node -e "const s=require('./$FILE').total; console.log(s.lines.pct)")
          FUNCS=$(node -e "const s=require('./$FILE').total; console.log(s.functions.pct)")
          BRANCH=$(node -e "const s=require('./$FILE').total; console.log(s.branches.pct)")
          STMTS=$(node -e "const s=require('./$FILE').total; console.log(s.statements.pct)")

          BODY=$(cat <<EOF
          ## рџ§Є API E2E Coverage
          - **Lines:** ${LINES}%
          - **Functions:** ${FUNCS}%
          - **Branches:** ${BRANCH}%
          - **Statements:** ${STMTS}%

          _Generated by GitHub Actions_
          EOF
          )

          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Comment PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: api-e2e-coverage
          message: ${{ steps.cov.outputs.body }}
