name: API E2E

on:
  push:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-e2e.yml"
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/api-e2e.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Run E2E with coverage
        run: npm run test:e2e:cov

      - name: Upload coverage html
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-e2e-coverage-html
          path: apps/api/coverage/e2e/lcov-report
          if-no-files-found: warn

      - name: Upload coverage lcov
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-e2e-coverage-lcov
          path: apps/api/coverage/e2e/lcov.info
          if-no-files-found: warn
