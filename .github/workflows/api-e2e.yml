name: API E2E

on:
  push:
    branches: [master, main]
    paths:
      - '**'
  pull_request:
    branches: [master, main]
    paths:
      - '**'

jobs:
  e2e:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Run E2E with coverage
        run: npm run test:e2e -- --coverage

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage-html
          path: coverage/e2e/lcov-report

      - name: Upload coverage lcov
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage-lcov
          path: coverage/e2e/lcov.info

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-coverage-summary
          path: coverage/e2e/coverage-summary.json

  coverage-comment:
    if: github.event_name == 'pull_request'
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download coverage summary artifact
        uses: actions/download-artifact@v4
        with:
          name: e2e-coverage-summary
          path: coverage/e2e

      - name: Build coverage body
        id: cov
        shell: bash
        run: |
          FILE="coverage/e2e/coverage-summary.json"
          if [ ! -f "$FILE" ]; then
            echo "body=⚠️ coverage-summary.json not found" >> $GITHUB_OUTPUT
            exit 0
          fi

          LINES=$(node -e "const s=require('./$FILE').total; console.log(s.lines.pct)")
          FUNCS=$(node -e "const s=require('./$FILE').total; console.log(s.functions.pct)")
          BRANCH=$(node -e "const s=require('./$FILE').total; console.log(s.branches.pct)")
          STMTS=$(node -e "const s=require('./$FILE').total; console.log(s.statements.pct)")

          BODY=$(cat <<EOF
          ## 🧪 API E2E Coverage
          - **Lines:** ${LINES}%
          - **Functions:** ${FUNCS}%
          - **Branches:** ${BRANCH}%
          - **Statements:** ${STMTS}%

          _Generated by GitHub Actions_
          EOF
          )

          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Comment PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: api-e2e-coverage
          message: ${{ steps.cov.outputs.body }}
